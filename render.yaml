# Render Blueprint for the FastAPI backend (https://render.com/docs/blueprint-spec).
# The Next.js frontend is deployed separately on Vercel (see README → Deployment).
services:
  - type: web
    name: zoom-clone-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        value: sqlite:///./zoom_clone.db
      - key: SEED_ON_STARTUP
        value: "true"
      # Set these to your Vercel URL, e.g. https://zoom-clone.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
